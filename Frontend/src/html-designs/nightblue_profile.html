<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>@rockagency</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;background:#050a24;font-family:'Poppins',system-ui,sans-serif;color:#eef0ff}
body{display:flex;justify-content:center}

/* Phone frame: 747x1600 ratio (~9:19.3) */
.phone{position:relative;width:100%;max-width:430px;aspect-ratio:747/1600;min-height:100vh;overflow:hidden;
  background:linear-gradient(180deg,#0d1a6b 0%,#1a2a8c 22%,#1f2f8f 45%,#2a2a80 70%,#0c1240 100%)}
@media(min-width:500px){.phone{min-height:0;height:min(100vh,930px);width:auto;border-radius:34px;margin:auto;box-shadow:0 20px 60px #0008}}

/* Background scene */
.scene{position:absolute;inset:0;filter:blur(1.5px)}
.moon{position:absolute;top:5%;right:11%;width:76px;height:76px;border-radius:50%;
  background:radial-gradient(circle at 40% 40%,#fff 0%,#dfe6ff 45%,#9fb0ff 100%);
  box-shadow:0 0 40px 18px rgba(170,190,255,.55),0 0 120px 50px rgba(120,150,255,.3);animation:moon 6s ease-in-out infinite}
@keyframes moon{50%{box-shadow:0 0 55px 24px rgba(170,190,255,.7),0 0 140px 60px rgba(120,150,255,.38)}}
.hill{position:absolute;left:-10%;width:130%;border-radius:50%}
.h1{top:20%;height:25%;background:#16226f;opacity:.7}
.h2{top:33%;height:40%;background:#1b2a85;opacity:.6;left:-30%}
.h3{top:62%;height:50%;background:#33307f;opacity:.55;left:20%}
.house{position:absolute;top:14.5%;right:3%;width:24%;height:15%;background:#1a2468;
  clip-path:polygon(0 38%,28% 0,100% 0,100% 100%,0 100%)}
.win{position:absolute;width:11%;height:23%;background:#f5b53f;top:56%;border-radius:2px;box-shadow:0 0 14px #f5b53f;animation:glow 4s ease-in-out infinite}
.w1{left:30%}.w2{left:58%;animation-delay:1.3s}
@keyframes glow{50%{opacity:.7;box-shadow:0 0 8px #f5b53f}}
canvas#stars{position:absolute;inset:0;width:100%;height:100%}

/* Content */
.content{position:relative;z-index:2;height:100%;padding:8.2% 14% 0;display:flex;flex-direction:column;align-items:center}
.wrap{width:100%}

.avatar{width:27%;aspect-ratio:1;border-radius:50%;padding:1.1%;margin:0 auto;
  background:linear-gradient(135deg,#cfd9ff,#7f93ff);box-shadow:0 0 30px rgba(130,150,255,.6);
  animation:float 5s ease-in-out infinite}
.avatar div{width:100%;height:100%;border-radius:50%;border:3px solid #1b2a85;
  background:linear-gradient(180deg,#5a6fb0 0%,#e8a778 38%,#2b2f55 62%,#10142e 100%);position:relative;overflow:hidden}
.avatar div::before{content:"";position:absolute;left:34%;top:26%;width:30%;height:34%;border-radius:45% 45% 40% 40%;background:#2a2230}
.avatar div::after{content:"";position:absolute;left:10%;bottom:-18%;width:80%;height:50%;border-radius:50% 50% 0 0;background:#14172f}
@keyframes float{50%{transform:translateY(-5px)}}

.name{margin-top:3.4%;text-align:center;font-size:clamp(24px,7.2vw,31px);font-weight:500;letter-spacing:.3px;display:flex;justify-content:center;align-items:center;gap:8px}
.badge{width:.8em;height:.8em;flex:none}
.bio{text-align:center;font-size:clamp(13px,3.7vw,16px);line-height:1.6;color:#aeb9ff;margin-top:2%;font-weight:400}

.stats{display:flex;justify-content:space-between;margin:6.5% 3% 0;text-align:center}
.stat{flex:1;position:relative;padding:0 2%}
.stat+.stat::before{content:"";position:absolute;left:0;top:6%;height:88%;width:1px;background:rgba(150,165,255,.3)}
.stat b{display:block;font-weight:500;font-size:clamp(15px,4.2vw,18px);color:#fff}
.stat span{font-size:clamp(12px,3.4vw,14px);color:#97a5f0;font-weight:300}

.glass{position:relative;display:flex;align-items:center;border:1.5px solid rgba(140,155,255,.45);
  background:linear-gradient(135deg,rgba(90,105,215,.55),rgba(60,70,160,.45));
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:#fff;text-decoration:none;overflow:hidden;
  box-shadow:0 8px 26px rgba(10,15,70,.45),inset 0 1px 0 rgba(255,255,255,.12);
  transition:transform .25s,box-shadow .25s,border-color .25s;cursor:pointer}
.glass::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.18),transparent);transform:skewX(-20deg);transition:left .7s}
.glass:hover::after{left:130%}
.glass:hover{transform:translateY(-3px) scale(1.01);border-color:rgba(190,200,255,.8);box-shadow:0 12px 30px rgba(10,15,90,.6)}
.glass:active{transform:scale(.97)}

.follow{margin-top:5.4%;height:clamp(54px,14.2vw,62px);border-radius:40px;justify-content:center;gap:5.5%;font-size:clamp(14px,4.1vw,17px);font-weight:400;padding:0 6%;
  background:linear-gradient(90deg,rgba(80,100,230,.65),rgba(70,80,170,.55));animation:pulse 3s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 8px 30px rgba(110,130,255,.55),inset 0 1px 0 rgba(255,255,255,.12)}}
.follow .arr{position:absolute;right:6%}
.follow svg.ig{width:32px;height:32px}

.links{margin-top:5%;display:flex;flex-direction:column;gap:clamp(10px,2.8vw,14px)}
.link{height:clamp(62px,16.5vw,72px);border-radius:24px;padding:0 5.5%;gap:5.5%;opacity:0;transform:translateY(24px)}
.link.show{opacity:1;transform:none;transition:opacity .6s,transform .6s cubic-bezier(.2,.8,.2,1),box-shadow .25s,border-color .25s}
.link.show:hover{transform:translateY(-3px) scale(1.01)}
.ico{width:clamp(40px,11.2vw,46px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;flex:none;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.ico svg{width:52%;height:52%}
.txt{flex:1;line-height:1.35}
.txt b{display:block;font-weight:500;font-size:clamp(14px,4vw,16px)}
.txt small{font-size:clamp(11px,3.2vw,13px);color:#aab6ff;font-weight:300}
.arr{width:20px;height:20px;transition:transform .25s}
.link:hover .arr{transform:translateX(5px)}
.follow:hover .arr{transform:translate(3px,-3px)}

.ig-g{background:linear-gradient(45deg,#fdc468,#f0562f 35%,#d6249f 65%,#7b3fe4)}
.yt{background:linear-gradient(135deg,#e1364f,#c0224a)}
.wa{background:linear-gradient(135deg,#4cc38a,#2f9f74)}
.pf{background:linear-gradient(135deg,#6f7fd8,#a05ad8)}
.lp{background:linear-gradient(135deg,#4458f0,#6a5cf5)}
.ct{background:linear-gradient(135deg,#7a4be8,#a15af0)}

.foot{position:absolute;left:14%;right:14%;top:88.4%;z-index:3}
.soc{display:flex;align-items:center;justify-content:center;gap:4.1%}
.soc::before,.soc::after{content:"";flex:1;height:1px;background:rgba(140,155,255,.35)}
.soc::before{margin-right:3.7%}.soc::after{margin-left:3.7%}
.soc a{width:9.3%;flex:none;aspect-ratio:1;border-radius:50%;border:1.5px solid rgba(140,155,255,.5);background:rgba(25,35,110,.6);display:grid;place-items:center;color:#fff;transition:transform .3s,background .3s}
.soc a:hover{transform:translateY(-4px) rotate(8deg);background:rgba(90,105,230,.8)}
.soc svg{width:46%;height:46%}
.tag{margin-top:4.6%;text-align:center;font-size:clamp(10px,2.9vw,12px);letter-spacing:.2em;color:#6f7cc4;font-weight:400;white-space:nowrap}
.tag i{font-style:normal;margin:0 .8em}

.fade{opacity:0;transform:translateY(16px);transition:opacity .7s,transform .7s}
.fade.show{opacity:1;transform:none}
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.35);transform:scale(0);animation:rip .6s linear;pointer-events:none}
@keyframes rip{to{transform:scale(4);opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.link,.fade{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="phone">
  <div class="scene">
    <div class="moon"></div>
    <div class="hill h1"></div><div class="hill h2"></div>
    <div class="house"><div class="win w1"></div><div class="win w2"></div></div>
    <div class="hill h3"></div>
  </div>
  <canvas id="stars"></canvas>

  <div class="content"><div class="wrap">
    <div class="avatar fade"><div></div></div>
    <h1 class="name fade">@rockagency
      <svg class="badge" viewBox="0 0 24 24"><path fill="#2f8cff" d="M12 1l3 2.2 3.7-.2 1.3 3.5 3 2.1-1 3.6 1 3.6-3 2.1-1.3 3.5-3.7-.2L12 23l-3-2.2-3.7.2L4 17.5l-3-2.1 1-3.6-1-3.6 3-2.1 1.3-3.5 3.7.2z"/><path fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" d="M7.8 12.2l3 3 5.6-6"/></svg>
    </h1>
    <p class="bio fade">Digital agency specializing in products,<br>commerce and SaaS websites.</p>

    <div class="stats fade">
      <div class="stat"><b data-n="124">0</b><span>Posts</span></div>
      <div class="stat"><b data-n="12.5" data-s="K">0</b><span>Followers</span></div>
      <div class="stat"><b data-n="48">0</b><span>Following</span></div>
    </div>

    <a class="glass follow fade" href="#">
      <svg class="ig" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.3" cy="6.7" r="1" fill="#fff" stroke="none"/></svg>
      <span>Follow on Instagram</span>
      <svg class="arr" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M8 7h9v9"/></svg>
    </a>

    <div class="links">
      <a class="glass link" href="#"><div class="ico ig-g"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.3" cy="6.7" r="1" fill="#fff" stroke="none"/></svg></div><div class="txt"><b>Instagram</b><small>@rockagency</small></div><svg class="arr" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h16M14 6l6 6-6 6"/></svg></a>
      <a class="glass link" href="#"><div class="ico yt"><svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="4" fill="#fff"/><path d="M10 9l5 3-5 3z" fill="#d02a4a"/></svg></div><div class="txt"><b>YouTube</b><small>Watch our latest videos</small></div><svg class="arr" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h16M14 6l6 6-6 6"/></svg></a>
      <a class="glass link" href="#"><div class="ico wa"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"><path d="M3 21l1.5-4.6A9 9 0 1 1 8 19.6z"/><path d="M9 8.5c0 3.5 3 6.5 6.5 6.5l1-1.7-2-1-1 .8c-1-.4-2-1.4-2.4-2.4l.8-1-1-2z" fill="#fff" stroke="none"/></svg></div><div class="txt"><b>WhatsApp</b><small>Chat with us</small></div><svg class="arr" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h16M14 6l6 6-6 6"/></svg></a>
    </div>
  </div></div>
</div>

<script>
/* Twinkling stars */
const cv=document.getElementById('stars'),cx=cv.getContext('2d');let S=[];
function size(){const r=cv.getBoundingClientRect();cv.width=r.width;cv.height=r.height;
  S=Array.from({length:55},()=>({x:Math.random()*cv.width,y:Math.random()*cv.height*.45,r:Math.random()*1.6+.3,p:Math.random()*6.28,s:Math.random()*.03+.01}))}
function draw(){cx.clearRect(0,0,cv.width,cv.height);
  S.forEach(s=>{s.p+=s.s;cx.globalAlpha=.35+.55*Math.abs(Math.sin(s.p));cx.fillStyle='#cfd8ff';cx.beginPath();cx.arc(s.x,s.y,s.r,0,6.28);cx.fill()});
  requestAnimationFrame(draw)}
size();draw();addEventListener('resize',size);

/* Entrance sequence: header items, then links one by one */
document.querySelectorAll('.fade').forEach((e,i)=>setTimeout(()=>e.classList.add('show'),150+i*120));
document.querySelectorAll('.link').forEach((e,i)=>setTimeout(()=>e.classList.add('show'),800+i*110));

/* Count-up stats */
setTimeout(()=>document.querySelectorAll('[data-n]').forEach(el=>{
  const t=parseFloat(el.dataset.n),sfx=el.dataset.s||'',dec=t%1?1:0,t0=performance.now();
  (function f(n){const k=Math.min((n-t0)/1400,1),v=t*(1-Math.pow(1-k,3));
    el.textContent=v.toFixed(dec)+sfx;if(k<1)requestAnimationFrame(f)})(t0)}),500);

/* Ripple on click + 3D tilt on hover */
document.querySelectorAll('.glass').forEach(b=>{
  b.addEventListener('click',e=>{e.preventDefault();const r=b.getBoundingClientRect(),d=Math.max(r.width,r.height)/3,
    s=document.createElement('span');s.className='ripple';
    s.style.cssText=`width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px`;
    b.appendChild(s);setTimeout(()=>s.remove(),600)});
});

/* Footer is static markup injected here to keep body tidy */
const f=document.createElement('div');f.className='foot fade';
f.innerHTML=`<div class="soc">
<a href="#"><svg viewBox="0 0 24 24" fill="#fff"><path d="M14 8V6.5c0-.7.3-1 1-1h2V2h-3c-3 0-4 2-4 4v2H7.5v3.5H10V22h4v-10.5h2.8L17.3 8z"/></svg></a>
<a href="#"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.3" cy="6.7" r="1" fill="#fff" stroke="none"/></svg></a>
<a href="#"><svg viewBox="0 0 24 24" fill="#fff"><path d="M4 9h3.5v11H4zM5.7 3.8a2 2 0 1 1 0 4 2 2 0 0 1 0-4zM10 9h3.3v1.6c.5-.9 1.7-1.9 3.5-1.9 3.6 0 4.2 2.4 4.2 5.4V20h-3.5v-5.2c0-1.3 0-2.9-1.8-2.9s-2.1 1.4-2.1 2.8V20H10z"/></svg></a>
<a href="#"><svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="4" fill="#fff"/><path d="M10 9l5 3-5 3z" fill="#1a2470"/></svg></a></div>
<div class="tag">CREATIVE<i>/</i>STRATEGY<i>/</i>DEVELOPMENT</div>`;
document.querySelector('.content').appendChild(f);
setTimeout(()=>f.classList.add('show'),1500);
</script>
</body>
</html>
